[build-system]
requires = [
    "setuptools>=68",
]
build-backend = "setuptools.build_meta"

[project]
name = "Bed-Visualizer"
version = "1.1.4"
description = "Displays 3D mesh of bed topography report."
authors = [
    { name = "jneilliii", email = "jneilliii+octoprint@gmail.com" },
]
requires-python = ">=3.7,<4"
dependencies = []
dynamic = [
    "license",
]

[project.entry-points."octoprint.plugin"]
bedlevelvisualizer = "octoprint_bedlevelvisualizer"

[project.urls]
Homepage = "https://github.com/jneilliii/OctoPrint-BedLevelVisualizer"

[project.optional-dependencies]
develop = [
    "go-task-bin",
]

[project.readme]
file = "README.md"
content-type = "text/markdown"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = [
    "octoprint_bedlevelvisualizer",
    "octoprint_bedlevelvisualizer.*",
]
